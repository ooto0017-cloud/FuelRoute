<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101c2b">
<title>FuelRoute — маршруты Ташкента</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="/style.css?v=routes-2">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
<script src="/app.js?v=routes-2" defer></script>
</head>
<body>
<header class="top"><div class="bar">
<a class="brand" href="/"><span class="logo" aria-hidden="true">↗</span>FuelRoute</a>
<span class="city">Ташкент, Узбекистан</span>
</div></header>
<main>

<div class="workspace">
<aside class="panel">
<h1>Маршрут и топливо</h1>
<form id="plan">
<div class="stops">
<label><span class="dot a">А</span>Откуда<select name="start"></select></label>
<button id="swap" class="swap" type="button" aria-label="Поменять точки А и Б" title="Поменять точки А и Б">⇅</button>
<label><span class="dot b">Б</span>Куда<select name="end"></select></label>
</div>
<label>Топливо<select name="fuel"><option value="gasoline">Бензин</option><option value="diesel">Дизель</option><option value="methane">Метан</option><option value="propane">Пропан</option></select></label>
<div class="fields">
<label>Расход, <span data-unit></span>/100 км<input type="number" min=".01" max="1000" step="any" name="consumption" value="9" required></label>
<label>Остаток, <span data-unit></span><input type="number" min="0" max="1000" step="any" name="remaining" value="5" required></label>
<label>Резерв, <span data-unit></span><input type="number" min="0" max="1000" step="any" name="reserve" value=".2" required></label>
<label>Ёмкость, <span data-unit></span><input type="number" min=".01" max="1000" step="any" name="capacity" value="50" required></label>
</div>
<button class="submit" type="submit">Обновить маршрут <span aria-hidden="true">↗</span></button>
</form>
<div id="choices" aria-label="Варианты маршрута"></div>
<div id="result" aria-live="polite" aria-atomic="true"></div>
</aside>
<section class="map-panel" aria-label="Карта Ташкента">
<div class="map-head"><h2>Карта Ташкента</h2><span id="updated" role="status">Загрузка карты</span></div>
<div id="map" aria-label="Интерактивная карта маршрута"></div>
<div class="map-foot"><div class="legend"><span><i></i> Маршрут</span><span><i></i> АЗС</span></div><span>Время без текущих пробок · наличие топлива не подтверждено</span></div>
</section>
</div>
</main>
</body></html>
